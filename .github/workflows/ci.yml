name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  api-typecheck:
    name: API typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit

  docs-norte:
    name: Norte docs present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          test -f .cursorrules
          test -f .cursor-prompts.md
          test -f SYNAPMSG_NORTE.md
          test -f SECURITY.md
          test -f docker-compose.yml
          test -f .env.example
          test -f docs/comparativa-synapmsg-norte.pdf
