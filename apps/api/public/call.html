<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Synapmsg Call</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #0B141A; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; }
    #stage { position: relative; width: 100%; height: 100%; background: #000; }
    video { background: #111; object-fit: cover; }
    #remote { width: 100%; height: 100%; }
    #local {
      position: absolute; right: 12px; top: 12px; width: 112px; height: 160px;
      border-radius: 12px; border: 2px solid #30B0B0; z-index: 2; transform: scaleX(-1);
    }
    #local.rear { transform: scaleX(1); }
    #local.audio-only, #local.cam-off { display: none; }
    #banner {
      position: absolute; left: 0; right: 0; bottom: 148px; text-align: center;
      z-index: 3; padding: 0 16px; pointer-events: none;
    }
    #status { font-size: 15px; color: #40C0C0; text-shadow: 0 1px 4px #000; white-space: pre-line; }
    #captions {
      position: absolute; left: 12px; right: 12px; bottom: 96px; z-index: 3;
      min-height: 44px; max-height: 96px; overflow: hidden;
      background: rgba(0,0,0,0.55); border-radius: 12px; padding: 10px 12px;
      font-size: 15px; line-height: 1.35; text-align: center;
      display: none;
    }
    #captions.show { display: block; }
    #captions .who { color: #40C0C0; font-size: 12px; margin-bottom: 4px; }
    #avatar {
      display: none; position: absolute; inset: 0; align-items: center; justify-content: center;
      flex-direction: column; gap: 12px; z-index: 1;
    }
    #avatar.show { display: flex; }
    #avatar .circle {
      width: 96px; height: 96px; border-radius: 48px; background: #30B0B0; color: #000;
      display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 700;
    }
    #controls {
      position: absolute; left: 0; right: 0; bottom: 16px; display: flex;
      justify-content: center; gap: 12px; z-index: 4; flex-wrap: wrap;
    }
    button.ctrl {
      width: 52px; height: 52px; border-radius: 26px; border: none; font-size: 20px;
      background: #2A2A2A; color: #fff;
    }
    button.ctrl.off { background: #E53935; }
    button.ctrl.on { background: #30B0B0; color: #000; }
    button#hang { background: #E53935; width: 60px; height: 60px; border-radius: 30px; }
  </style>
</head>
<body>
  <div id="stage">
    <video id="remote" autoplay playsinline></video>
    <video id="local" autoplay playsinline muted></video>
    <div id="avatar"><div class="circle" id="initials">?</div><div id="peerName">Conectando…</div></div>
    <div id="banner"><div id="status">Conectando…</div></div>
    <div id="captions"><div class="who" id="capWho"></div><div id="capText"></div></div>
    <div id="controls">
      <button class="ctrl" id="muteMic" title="Micrófono">🎤</button>
      <button class="ctrl" id="muteCam" title="Cámara">📷</button>
      <button class="ctrl" id="flipCam" title="Cambiar cámara">🔄</button>
      <button class="ctrl" id="ccBtn" title="Subtítulos">CC</button>
      <button class="ctrl" id="hang" title="Colgar">📞</button>
    </div>
  </div>
  <script>
(function () {
  const params = new URLSearchParams(location.search);
  const token = params.get('token') || '';
  const chatId = params.get('chatId') || '';
  let wantVideo = params.get('video') !== '0';
  const displayName = params.get('name') || 'Synapmsg';
  const role = params.get('role') || 'caller';
  const preferLang = (params.get('lang') || 'es').toLowerCase();
  const apiBase = params.get('api') || (location.protocol + '//' + location.host);
  const wsBase = params.get('ws') || ((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');

  const statusEl = document.getElementById('status');
  const remoteVideo = document.getElementById('remote');
  const localVideo = document.getElementById('local');
  const avatar = document.getElementById('avatar');
  const initials = document.getElementById('initials');
  const peerName = document.getElementById('peerName');
  const muteMicBtn = document.getElementById('muteMic');
  const muteCamBtn = document.getElementById('muteCam');
  const flipCamBtn = document.getElementById('flipCam');
  const ccBtn = document.getElementById('ccBtn');
  const captionsEl = document.getElementById('captions');
  const capWho = document.getElementById('capWho');
  const capText = document.getElementById('capText');

  initials.textContent = (displayName.trim()[0] || 'S').toUpperCase();
  peerName.textContent = displayName;

  function setVideoUiMode() {
    if (!wantVideo) {
      localVideo.classList.add('audio-only');
      avatar.classList.add('show');
      muteCamBtn.style.display = 'none';
      flipCamBtn.style.display = 'none';
    } else {
      localVideo.classList.remove('audio-only');
      muteCamBtn.style.display = '';
      flipCamBtn.style.display = '';
    }
  }
  setVideoUiMode();

  function setStatus(t) { statusEl.textContent = t; }
  function postNative(obj) {
    try {
      if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify(obj));
    } catch (_) {}
  }

  let pc = null;
  let localStream = null;
  let ws = null;
  let polite = role === 'callee';
  let makingOffer = false;
  let ignoreOffer = false;
  let micOn = true;
  let camOn = wantVideo;
  let facingMode = 'user'; // frontal por defecto
  let peerReady = false;
  let offerSent = false;
  let captionsOn = false;
  let recognition = null;
  let hungUp = false;
  let iceRestartCount = 0;
  let wsRetry = 0;
  let wsRetryTimer = null;
  let adaptTimer = null;
  let wakeLock = null;
  let qualityLevel = 0; // 0 best … 3 lowest send; 4 = video send off (audio kept)
  let goodStreak = 0;
  const pendingIce = [];

  const QUALITY = [
    { w: 640, h: 480, fps: 24 },
    { w: 480, h: 360, fps: 20 },
    { w: 320, h: 240, fps: 15 },
    { w: 160, h: 120, fps: 10 },
  ];

  let iceServers = [
    { urls: 'stun:stun.cloudflare.com:3478' },
  ];
  // PIEZA 2/3: relay by default — peer never learns host/srflx IP (audio+video).
  let iceTransportPolicy = 'relay';
  const allowDirectParam = params.get('allowDirect') === '1';
  const seenRemoteIps = [];

  async function holdWakeLock() {
    try {
      if (navigator.wakeLock && navigator.wakeLock.request) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => {
          wakeLock = null;
        });
        postNative({ type: 'wake-lock', on: true });
      }
    } catch (_) {
      postNative({ type: 'wake-lock', on: false });
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && !hungUp) void holdWakeLock();
  });

  async function loadIceFromConfig() {
    try {
      const q = allowDirectParam ? '?allowDirect=1' : '';
      const r = await fetch(apiBase.replace(/\/$/, '') + '/call/config' + q, {
        headers: token ? { Authorization: 'Bearer ' + token } : {},
      });
      if (!r.ok) return;
      const cfg = await r.json();
      if (Array.isArray(cfg.iceServers) && cfg.iceServers.length) {
        iceServers = cfg.iceServers;
      }
      if (cfg.iceTransportPolicy === 'relay' || cfg.iceTransportPolicy === 'all') {
        iceTransportPolicy = cfg.iceTransportPolicy;
      }
      if (!allowDirectParam) iceTransportPolicy = 'relay';
      postNative({
        type: 'ice-config',
        policy: iceTransportPolicy,
        provider: cfg.provider || 'unknown',
        servers: (iceServers || []).length,
      });
    } catch (_) {}
  }

  function ipFromCandidate(cand) {
    if (!cand) return null;
    const s = typeof cand === 'string' ? cand : (cand.candidate || '');
    const m = s.match(/\s(\d{1,3}(?:\.\d{1,3}){3})\s+\d+\s+typ\s+(\w+)/);
    if (m) return { ip: m[1], typ: m[2] };
    const m6 = s.match(/\s([0-9a-fA-F:]+)\s+\d+\s+typ\s+(\w+)/);
    if (m6 && m6[1].includes(':')) return { ip: m6[1], typ: m6[2] };
    return null;
  }

  function sendSignal(payload) {
    if (!ws || ws.readyState !== 1) return;
    ws.send(JSON.stringify({ type: 'webrtc_signal', chatId, signal: payload }));
  }

  function stopStream(stream) {
    if (!stream) return;
    try {
      stream.getTracks().forEach((t) => {
        try { t.stop(); } catch (_) {}
      });
    } catch (_) {}
  }

  function videoConstraints(face, level) {
    const q = QUALITY[Math.min(level, QUALITY.length - 1)];
    return {
      facingMode: { ideal: face },
      width: { ideal: q.w },
      height: { ideal: q.h },
      frameRate: { ideal: q.fps, max: q.fps },
    };
  }

  async function applyVideoQuality(level) {
    if (!localStream || !wantVideo) return;
    const track = localStream.getVideoTracks()[0];
    if (!track) return;
    if (level >= 4) {
      track.enabled = false;
      localVideo.classList.add('cam-off');
      postNative({ type: 'video-quality', level: 4, note: 'video paused for network; audio kept' });
      return;
    }
    if (camOn) {
      track.enabled = true;
      localVideo.classList.remove('cam-off');
    }
    const q = QUALITY[level];
    try {
      await track.applyConstraints({
        width: { ideal: q.w },
        height: { ideal: q.h },
        frameRate: { ideal: q.fps, max: q.fps },
      });
      postNative({ type: 'video-quality', level: level, w: q.w, h: q.h, fps: q.fps });
    } catch (_) {}
  }

  async function adaptFromStats() {
    if (!pc || hungUp || !wantVideo) return;
    try {
      const stats = await pc.getStats();
      let rtt = 0;
      let loss = 0;
      let packetsSent = 0;
      let packetsLost = 0;
      let availableOut = null;
      stats.forEach((r) => {
        if (r.type === 'candidate-pair' && (r.selected || r.nominated) && r.state === 'succeeded') {
          if (typeof r.currentRoundTripTime === 'number') rtt = r.currentRoundTripTime * 1000;
          if (typeof r.availableOutgoingBitrate === 'number') availableOut = r.availableOutgoingBitrate;
        }
        if (r.type === 'outbound-rtp' && r.kind === 'video') {
          packetsSent = r.packetsSent || 0;
          packetsLost = r.packetsLost || 0;
        }
        if (r.type === 'remote-inbound-rtp' && r.kind === 'video') {
          if (typeof r.packetsLost === 'number') packetsLost = r.packetsLost;
          if (typeof r.roundTripTime === 'number') rtt = Math.max(rtt, r.roundTripTime * 1000);
          if (typeof r.fractionLost === 'number') loss = r.fractionLost;
        }
      });
      if (packetsSent > 40) loss = Math.max(loss, packetsLost / Math.max(1, packetsSent));

      const bad =
        rtt > 450 ||
        loss > 0.08 ||
        (availableOut != null && availableOut > 0 && availableOut < 180000);
      const good =
        rtt > 0 &&
        rtt < 220 &&
        loss < 0.02 &&
        (availableOut == null || availableOut > 400000);

      if (bad) {
        goodStreak = 0;
        if (qualityLevel < 4) {
          qualityLevel += 1;
          // Never touch audio — only video constraints / send enable.
          await applyVideoQuality(qualityLevel);
          setStatus(
            (iceTransportPolicy === 'relay' ? 'Conectado · relé' : 'Conectado') +
              '\nRed lenta · bajando video (audio intacto)',
          );
        }
      } else if (good) {
        goodStreak += 1;
        if (goodStreak >= 3 && qualityLevel > 0) {
          qualityLevel -= 1;
          goodStreak = 0;
          await applyVideoQuality(qualityLevel);
        }
      } else {
        goodStreak = 0;
      }
    } catch (_) {}
  }

  function startAdaptLoop() {
    if (adaptTimer) clearInterval(adaptTimer);
    adaptTimer = setInterval(() => { void adaptFromStats(); }, 3000);
  }

  async function ensureMedia() {
    if (localStream) return localStream;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('Este WebView no soporta cámara/micrófono');
    }

    const audioConstraints = {
      echoCancellation: true,
      noiseSuppression: true,
      autoGainControl: true,
    };

    // Llamada de voz o fallback: SOLO micrófono
    if (!wantVideo) {
      localStream = await navigator.mediaDevices.getUserMedia({
        audio: audioConstraints,
        video: false,
      });
      localStream.getVideoTracks().forEach((t) => {
        try { t.stop(); localStream.removeTrack(t); } catch (_) {}
      });
      localVideo.srcObject = null;
      postNative({ type: 'camera-blocked' });
      return localStream;
    }

    // Videollamada: frontal por defecto. Si niega cámara → sigue solo audio.
    try {
      localStream = await navigator.mediaDevices.getUserMedia({
        audio: audioConstraints,
        video: videoConstraints('user', qualityLevel),
      });
      facingMode = 'user';
      localStream.getVideoTracks().forEach((t) => {
        t.enabled = true;
        try { t.contentHint = 'motion'; } catch (_) {}
      });
      localVideo.srcObject = localStream;
      localVideo.classList.remove('rear');
      camOn = true;
      postNative({ type: 'camera-ready', facing: 'user' });
      return localStream;
    } catch (camErr) {
      // Cámara denegada o ausente: no abortar — audio manda.
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: audioConstraints,
          video: false,
        });
      } catch (micErr) {
        throw micErr;
      }
      wantVideo = false;
      camOn = false;
      setVideoUiMode();
      localVideo.srcObject = null;
      setStatus('Sin cámara · llamada solo con audio cifrado');
      postNative({ type: 'camera-denied-audio-only', message: String(camErr && camErr.message || camErr) });
      return localStream;
    }
  }

  async function flushPendingIce(conn) {
    while (pendingIce.length) {
      const c = pendingIce.shift();
      try { await conn.addIceCandidate(c); } catch (_) {}
    }
  }

  async function ensurePc() {
    if (pc) return pc;
    pc = new RTCPeerConnection({
      iceServers,
      iceTransportPolicy: iceTransportPolicy,
      iceCandidatePoolSize: 8,
    });
    pc.onicecandidate = (ev) => {
      if (!ev.candidate) return;
      const parsed = ipFromCandidate(ev.candidate);
      if (parsed && parsed.typ !== 'relay') {
        postNative({ type: 'ice-leak', side: 'local', ip: parsed.ip, typ: parsed.typ });
        if (iceTransportPolicy === 'relay') return;
      }
      sendSignal({ kind: 'ice', candidate: ev.candidate });
    };
    pc.ontrack = (ev) => {
      remoteVideo.srcObject = ev.streams[0] || new MediaStream([ev.track]);
      try { remoteVideo.play(); } catch (_) {}
      if (wantVideo && ev.track.kind === 'video') avatar.classList.remove('show');
      setStatus(iceTransportPolicy === 'relay' ? 'Conectado · relé' : 'Conectado');
      iceRestartCount = 0;
      postNative({ type: 'connected', policy: iceTransportPolicy });
      void logSelectedPair();
    };
    pc.oniceconnectionstatechange = () => {
      const s = pc && pc.iceConnectionState;
      if (s === 'connected' || s === 'completed') {
        setStatus(iceTransportPolicy === 'relay' ? 'Conectado · relé' : 'Conectado');
        iceRestartCount = 0;
        void logSelectedPair();
      } else if (s === 'checking') {
        setStatus('Negociando red…');
      } else if (s === 'disconnected') {
        setStatus('Relé interrumpido…');
        postNative({ type: 'relay-drop', state: 'disconnected' });
        setTimeout(() => {
          if (pc && pc.iceConnectionState === 'disconnected' && iceRestartCount < 3) {
            iceRestartCount += 1;
            setStatus('Reconectando relé…');
            try {
              pc.restartIce();
              if (role === 'caller') {
                offerSent = false;
                void makeOffer(true);
              }
            } catch (_) {}
          }
        }, 1800);
      } else if (s === 'failed') {
        if (iceRestartCount < 4) {
          iceRestartCount += 1;
          setStatus('Reintentando relé (' + iceRestartCount + ')…');
          try {
            pc.restartIce();
            if (role === 'caller') {
              offerSent = false;
              void makeOffer(true);
            }
          } catch (_) {
            setStatus('Relé caído. La llamada se cortó.');
            postNative({ type: 'error', message: 'ice-failed' });
          }
        } else {
          setStatus('Relé caído. La llamada se cortó.');
          postNative({ type: 'error', message: 'ice-failed' });
        }
      }
    };
    pc.onconnectionstatechange = () => {
      const s = pc && pc.connectionState;
      if (s === 'connected') {
        setStatus(iceTransportPolicy === 'relay' ? 'Conectado · relé' : 'Conectado');
        postNative({ type: 'connected', policy: iceTransportPolicy });
        void logSelectedPair();
        startAdaptLoop();
      } else if (s === 'connecting') {
        setStatus(wantVideo ? 'Conectando audio/video…' : 'Conectando audio…');
      } else if (s === 'failed') {
        setStatus('Enlace falló. Reintentando…');
      }
    };
    const stream = await ensureMedia();
    stream.getTracks().forEach((t) => pc.addTrack(t, stream));
    return pc;
  }

  async function logSelectedPair() {
    if (!pc) return;
    try {
      const stats = await pc.getStats();
      let selected = null;
      stats.forEach((r) => {
        if (r.type === 'candidate-pair' && (r.selected || r.nominated) && r.state === 'succeeded') {
          selected = r;
        }
      });
      if (!selected) {
        stats.forEach((r) => {
          if (r.type === 'candidate-pair' && r.state === 'succeeded') selected = r;
        });
      }
      if (!selected) return;
      const local = stats.get(selected.localCandidateId);
      const remote = stats.get(selected.remoteCandidateId);
      const info = {
        type: 'ice-pair',
        policy: iceTransportPolicy,
        local: local
          ? { ip: local.address || local.ip, typ: local.candidateType, port: local.port }
          : null,
        remote: remote
          ? { ip: remote.address || remote.ip, typ: remote.candidateType, port: remote.port }
          : null,
      };
      if (info.remote && info.remote.ip) {
        seenRemoteIps.push(info.remote);
      }
      postNative(info);
      setStatus(
        (iceTransportPolicy === 'relay' ? 'Conectado · relé' : 'Conectado') +
          '\nremoto: ' +
          (info.remote ? info.remote.typ + ' ' + info.remote.ip : '?'),
      );
    } catch (_) {}
  }

  /** DTLS-SRTP is mandatory: refuse to signal SDP without fingerprint. */
  function assertEncryptedSdp(sdp) {
    const body = (sdp && sdp.sdp) || '';
    if (!body || !/a=fingerprint:/i.test(body)) {
      throw new Error('SDP sin fingerprint DTLS — llamada abortada');
    }
    if (/a=encryption:disabled/i.test(body)) {
      throw new Error('Cifrado WebRTC desactivado — llamada abortada');
    }
    return sdp;
  }

  async function makeOffer(force) {
    if (offerSent && !force) return;
    if (!peerReady && !force) return;
    const conn = await ensurePc();
    try {
      makingOffer = true;
      await conn.setLocalDescription(await conn.createOffer({ iceRestart: !!force }));
      sendSignal({ kind: 'sdp', sdp: assertEncryptedSdp(conn.localDescription) });
      offerSent = true;
      setStatus(force ? 'Renegociando…' : 'Llamando al otro dispositivo…');
    } finally {
      makingOffer = false;
    }
  }

  async function onSignal(signal) {
    if (!signal || !signal.kind) return;

    if (signal.kind === 'ready') {
      peerReady = true;
      if (role === 'caller') await makeOffer(false);
      return;
    }

    if (signal.kind === 'ice') {
      const conn = await ensurePc();
      if (!signal.candidate) return;
      if (!conn.remoteDescription) {
        pendingIce.push(signal.candidate);
        return;
      }
      try { await conn.addIceCandidate(signal.candidate); } catch (_) {}
      return;
    }

    if (signal.kind === 'sdp' && signal.sdp) {
      const conn = await ensurePc();
      const desc = signal.sdp;
      const offerCollision =
        desc.type === 'offer' && (makingOffer || conn.signalingState !== 'stable');
      ignoreOffer = !polite && offerCollision;
      if (ignoreOffer) return;
      await conn.setRemoteDescription(assertEncryptedSdp(desc));
      await flushPendingIce(conn);
      if (desc.type === 'offer') {
        await conn.setLocalDescription(await conn.createAnswer());
        sendSignal({ kind: 'sdp', sdp: assertEncryptedSdp(conn.localDescription) });
      }
    }
  }

  function startCaptions() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      setStatus('Subtítulos no disponibles en este WebView');
      captionsOn = false;
      ccBtn.classList.remove('on');
      captionsEl.classList.remove('show');
      return;
    }
    recognition = new SR();
    recognition.lang = preferLang === 'en' ? 'en-US' : 'es-ES';
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.onresult = (ev) => {
      let text = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        text += ev.results[i][0].transcript;
      }
      capWho.textContent = 'Tú';
      capText.textContent = text;
    };
    recognition.onerror = () => {};
    recognition.onend = () => {
      if (captionsOn) {
        try { recognition.start(); } catch (_) {}
      }
    };
    try {
      recognition.start();
    } catch (_) {}
  }

  function stopCaptions() {
    if (recognition) {
      try { recognition.onend = null; recognition.stop(); } catch (_) {}
      recognition = null;
    }
  }

  function hangup() {
    if (hungUp) return;
    hungUp = true;
    stopCaptions();
    if (adaptTimer) clearInterval(adaptTimer);
    if (wsRetryTimer) clearTimeout(wsRetryTimer);
    try {
      if (wakeLock) wakeLock.release();
    } catch (_) {}
    wakeLock = null;
    try {
      if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'call_end', chatId }));
    } catch (_) {}
    try { if (ws) ws.close(); } catch (_) {}
    if (pc) { try { pc.close(); } catch (_) {} pc = null; }
    stopStream(localStream);
    localStream = null;
    postNative({ type: 'hangup' });
  }

  async function flipCamera() {
    if (!wantVideo || !localStream || !pc) return;
    const next = facingMode === 'user' ? 'environment' : 'user';
    setStatus(next === 'user' ? 'Cambiando a frontal…' : 'Cambiando a trasera…');
    try {
      const fresh = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: videoConstraints(next, Math.min(qualityLevel, 3)),
      });
      const newTrack = fresh.getVideoTracks()[0];
      if (!newTrack) throw new Error('Sin cámara ' + next);
      newTrack.enabled = camOn;
      try { newTrack.contentHint = 'motion'; } catch (_) {}

      const sender = pc.getSenders().find((s) => s.track && s.track.kind === 'video');
      const old = localStream.getVideoTracks()[0];
      if (sender) {
        await sender.replaceTrack(newTrack);
      }
      if (old) {
        try { localStream.removeTrack(old); old.stop(); } catch (_) {}
      }
      localStream.addTrack(newTrack);
      // Stop extra tracks from the temporary stream (none expected).
      fresh.getTracks().forEach((t) => {
        if (t !== newTrack) try { t.stop(); } catch (_) {}
      });

      facingMode = next;
      localVideo.srcObject = localStream;
      if (facingMode === 'user') localVideo.classList.remove('rear');
      else localVideo.classList.add('rear');
      if (!camOn) localVideo.classList.add('cam-off');
      else localVideo.classList.remove('cam-off');
      setStatus(iceTransportPolicy === 'relay' ? 'Conectado · relé' : 'Conectado');
      postNative({ type: 'camera-flip', facing: facingMode });
    } catch (e) {
      setStatus('No se pudo cambiar de cámara');
      postNative({ type: 'error', message: 'flip-failed: ' + (e && e.message || e) });
    }
  }

  muteMicBtn.onclick = () => {
    micOn = !micOn;
    if (localStream) localStream.getAudioTracks().forEach((t) => { t.enabled = micOn; });
    muteMicBtn.classList.toggle('off', !micOn);
    muteMicBtn.textContent = micOn ? '🎤' : '🔇';
  };
  muteCamBtn.onclick = () => {
    if (!wantVideo) return;
    camOn = !camOn;
    if (localStream) localStream.getVideoTracks().forEach((t) => { t.enabled = camOn; });
    muteCamBtn.classList.toggle('off', !camOn);
    if (camOn) localVideo.classList.remove('cam-off');
    else localVideo.classList.add('cam-off');
    postNative({ type: 'cam-muted', muted: !camOn });
  };
  flipCamBtn.onclick = () => { void flipCamera(); };
  ccBtn.onclick = () => {
    captionsOn = !captionsOn;
    ccBtn.classList.toggle('on', captionsOn);
    if (captionsOn) {
      captionsEl.classList.add('show');
      startCaptions();
      setStatus('Subtítulos ON');
    } else {
      stopCaptions();
      captionsEl.classList.remove('show');
    }
  };
  document.getElementById('hang').onclick = hangup;

  function connectWs() {
    if (hungUp) return;
    const url = wsBase + (wsBase.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(token);
    ws = new WebSocket(url);
    ws.onopen = async () => {
      wsRetry = 0;
      void holdWakeLock();
      setStatus(wantVideo ? 'Permisos de micrófono y cámara…' : 'Permisos de micrófono…');
      try {
        await ensureMedia();
        setStatus(role === 'caller' ? 'Esperando al otro…' : 'Entrando…');
        sendSignal({ kind: 'ready' });
        setTimeout(() => sendSignal({ kind: 'ready' }), 800);
        setTimeout(() => sendSignal({ kind: 'ready' }), 2000);
        postNative({ type: 'media-ok', video: wantVideo });
      } catch (e) {
        const msg = (e && e.message) ? e.message : String(e);
        setStatus(
          (wantVideo
            ? 'Necesitamos el micrófono (y la cámara si aceptas).\n'
            : 'Activa el micrófono para Synapmsg\n') + msg
        );
        postNative({ type: 'error', message: msg });
      }
    };
    ws.onmessage = async (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch { return; }
      if (msg.type === 'webrtc_signal' && msg.chatId === chatId && msg.signal) {
        await onSignal(msg.signal);
      }
      if ((msg.type === 'call_end' || msg.type === 'call_reject') && msg.chatId === chatId) {
        setStatus('La otra persona colgó');
        setTimeout(hangup, 400);
      }
    };
    ws.onclose = () => {
      if (hungUp) return;
      if (wsRetry >= 6) {
        setStatus('Desconectado del servidor');
        return;
      }
      wsRetry += 1;
      const delay = Math.min(8000, 600 * Math.pow(1.6, wsRetry));
      setStatus('Reconectando señal… (' + wsRetry + ')');
      wsRetryTimer = setTimeout(connectWs, delay);
    };
    ws.onerror = () => {};
  }

  if (!token || !chatId) {
    setStatus('Falta token o chatId');
  } else {
    loadIceFromConfig().finally(connectWs);
  }
  window.addEventListener('pagehide', hangup);
})();
  </script>
</body>
</html>
