<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Synapmsg · FIDO2</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0a0a0a; color: #fff; padding: 24px; max-width: 480px; margin: 0 auto; }
    h1 { color: #30B0B0; font-size: 1.4rem; }
    input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: #fff; box-sizing: border-box; }
    button { background: #30B0B0; color: #000; font-weight: 600; border: none; cursor: pointer; }
    .msg { margin-top: 12px; color: #a0a0a0; white-space: pre-wrap; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Synapmsg FIDO2</h1>
  <p>Enrola una YubiKey / passkey. Pegá tu JWT de sesión (Ajustes → o login API).</p>
  <input id="token" placeholder="Bearer JWT" />
  <input id="label" placeholder="Etiqueta (ej. YubiKey 5)" value="YubiKey" />
  <button id="reg">Registrar passkey</button>
  <button id="auth">Probar autenticación</button>
  <div class="msg" id="msg"></div>
  <script>
    const API = location.origin;
    const msg = (t) => { document.getElementById('msg').textContent = t; };
    const headers = () => ({
      'Content-Type': 'application/json',
      Authorization: 'Bearer ' + document.getElementById('token').value.trim().replace(/^Bearer\s+/i,''),
    });
    function b64urlToBuf(b64url) {
      const pad = '='.repeat((4 - (b64url.length % 4)) % 4);
      const b64 = (b64url + pad).replace(/-/g, '+').replace(/_/g, '/');
      const bin = atob(b64);
      const buf = new ArrayBuffer(bin.length);
      const view = new Uint8Array(buf);
      for (let i = 0; i < bin.length; i++) view[i] = bin.charCodeAt(i);
      return buf;
    }
    function bufToB64url(buf) {
      const bytes = new Uint8Array(buf);
      let s = '';
      bytes.forEach((b) => s += String.fromCharCode(b));
      return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    document.getElementById('reg').onclick = async () => {
      try {
        const optRes = await fetch(API + '/security/webauthn/register/options', { method: 'POST', headers: headers(), body: '{}' });
        const opts = await optRes.json();
        if (!optRes.ok) throw new Error(opts.error || 'options failed');
        opts.challenge = b64urlToBuf(opts.challenge);
        opts.user.id = b64urlToBuf(opts.user.id);
        if (opts.excludeCredentials) {
          opts.excludeCredentials = opts.excludeCredentials.map((c) => ({ ...c, id: b64urlToBuf(c.id) }));
        }
        const cred = await navigator.credentials.create({ publicKey: opts });
        const att = {
          id: cred.id,
          rawId: bufToB64url(cred.rawId),
          type: cred.type,
          response: {
            clientDataJSON: bufToB64url(cred.response.clientDataJSON),
            attestationObject: bufToB64url(cred.response.attestationObject),
          },
          label: document.getElementById('label').value || 'Passkey',
        };
        const ver = await fetch(API + '/security/webauthn/register/verify', {
          method: 'POST', headers: headers(), body: JSON.stringify(att),
        });
        const out = await ver.json();
        if (!ver.ok) throw new Error(out.error || 'verify failed');
        msg('Registrado: ' + out.credentialId);
      } catch (e) { msg(String(e.message || e)); }
    };
    document.getElementById('auth').onclick = async () => {
      try {
        const optRes = await fetch(API + '/security/webauthn/auth/options', { method: 'POST', headers: headers(), body: '{}' });
        const opts = await optRes.json();
        if (!optRes.ok) throw new Error(opts.error || 'options failed');
        opts.challenge = b64urlToBuf(opts.challenge);
        if (opts.allowCredentials) {
          opts.allowCredentials = opts.allowCredentials.map((c) => ({ ...c, id: b64urlToBuf(c.id) }));
        }
        const assert = await navigator.credentials.get({ publicKey: opts });
        const body = {
          id: assert.id,
          rawId: bufToB64url(assert.rawId),
          type: assert.type,
          response: {
            clientDataJSON: bufToB64url(assert.response.clientDataJSON),
            authenticatorData: bufToB64url(assert.response.authenticatorData),
            signature: bufToB64url(assert.response.signature),
            userHandle: assert.response.userHandle ? bufToB64url(assert.response.userHandle) : undefined,
          },
        };
        const ver = await fetch(API + '/security/webauthn/auth/verify', {
          method: 'POST', headers: headers(), body: JSON.stringify(body),
        });
        const out = await ver.json();
        if (!ver.ok) throw new Error(out.error || 'verify failed');
        msg('Auth OK');
      } catch (e) { msg(String(e.message || e)); }
    };
  </script>
</body>
</html>
