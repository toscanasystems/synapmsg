name = "synapmsg-media"
main = "src/index.ts"
compatibility_date = "2024-11-01"
workers_dev = true

# Custom domain creates DNS automatically in the synapmsg.ai zone.
routes = [
  { pattern = "media.synapmsg.ai", custom_domain = true }
]

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "synapmsg-media"

[vars]
# Dominio de marca (proxy DNS en zona activa; origen R2 en Worker TOSCANA)
PUBLIC_BASE = "https://media.synapmsg.ai"
API_ORIGIN = "https://api.synapmsg.ai"
