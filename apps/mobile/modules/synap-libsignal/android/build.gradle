apply plugin: 'com.android.library'

group = 'expo.modules.synaplibsignal'
version = '1.0.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useDefaultAndroidSdkVersions()
useExpoPublishing()

android {
  namespace "expo.modules.synaplibsignal"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    ndk {
      abiFilters 'arm64-v8a'
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = '17'
    // libsignal-client ships Kotlin 2.1 metadata; Expo 51 compiles with 1.9.
    freeCompilerArgs += ['-Xskip-metadata-version-check']
  }
}

dependencies {
  // Official Signal libsignal JNI (Rust → .so)
  implementation('org.signal:libsignal-client:0.76.1') {
    // Keep Expo's Kotlin 1.9 stdlib on the compile classpath.
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    exclude group: 'org.jetbrains.kotlinx', module: 'kotlinx-coroutines-core'
    exclude group: 'org.jetbrains.kotlinx', module: 'kotlinx-coroutines-android'
  }
}
