# Synapmsg TURN — credentialed only (use-auth-secret). No anonymous, no openrelay.
# Relays DTLS-SRTP ciphertext; coturn cannot decrypt call audio.
listening-port=3478
fingerprint
lt-cred-mech
use-auth-secret
# secret injected via TURN_SECRET env → entrypoint rewrites
static-auth-secret=REPLACE_ME
realm=synapmsg.ai
server-name=synapmsg-turn
# Auth + nonce freshness (reject missing/invalid credentials)
stale-nonce=600
# No CLI / no TLS1.0-1.1 / no multicast peers
no-cli
no-tls
no-dtls
no-tlsv1
no-tlsv1_1
no-multicast-peers
# Logging: startup/errors only — no verbose session/peer dumps to stdout
simple-log
log-file=stdout
# TCP listening + TCP relay required on Railway (single TCP proxy).
# UDP listening kept for when the host exposes UDP; harmless if firewalled.
no-udp=false
no-tcp-relay=false
no-udp-relay=false
# Relay port band (internal bridging between allocations; not published by Railway)
min-port=49152
max-port=49200
# Deny only loopback / link-local / unspecified.
# Do NOT deny RFC1918: on Railway the relayed candidate is a private IP and
# CreatePermission between two TCP allocations needs those peer addresses.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-feff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
