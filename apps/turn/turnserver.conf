# Synapmsg TURN — credentialed, no anonymous, no open relay.
listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech
use-auth-secret
# secret injected via TURN_SECRET env → entrypoint rewrites
static-auth-secret=REPLACE_ME
realm=synapmsg.ai
server-name=synapmsg-turn
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1
# Prefer relay allocations only from authenticated users
stale-nonce=600
# Log without media content
simple-log
log-file=stdout
# Railway TCP proxy is TCP; keep UDP for when available
no-udp-relay=false
# Deny loopback / RFC1918 as peer destinations abuse
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
