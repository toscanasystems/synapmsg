# Synapmsg local infra — Postgres + Redis + MinIO
# Usage: docker compose up -d
# Aligns with root .env.example

services:
  postgres:
    image: postgres:16-alpine
    container_name: synapmsg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synapmsg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synapmsg}
      POSTGRES_DB: ${POSTGRES_DB:-synapmsg}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - synapmsg_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synapmsg} -d ${POSTGRES_DB:-synapmsg}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: synapmsg-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - synapmsg_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: synapmsg-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-synapmsg}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-synapmsgsecret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - synapmsg_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: create default bucket for local media
  minio-init:
    image: minio/mc:latest
    container_name: synapmsg-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-synapmsg} $${MINIO_ROOT_PASSWORD:-synapmsgsecret};
      mc mb --ignore-existing local/$${MINIO_BUCKET:-synapmsg-media};
      mc anonymous set download local/$${MINIO_BUCKET:-synapmsg-media};
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-synapmsg}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-synapmsgsecret}
      MINIO_BUCKET: ${MINIO_BUCKET:-synapmsg-media}

volumes:
  synapmsg_pg:
  synapmsg_redis:
  synapmsg_minio:
